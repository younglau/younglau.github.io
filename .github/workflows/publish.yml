name: Publish blog from Notion

on:
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'
  push:
    branches: [master]

concurrency:
  group: notion-blog-production
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/master' && vars.NOTION_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      digest: ${{ steps.digest.outputs.value }}
      deploy: ${{ steps.digest.outputs.deploy }}
    steps:
      - name: Check publishing configuration
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          for name in NOTION_TOKEN NOTION_DATA_SOURCE_ID VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [[ -n "${!name}" ]] || { echo "Configure $name before enabling publishing."; exit 1; }
          done
          [[ $(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type) == workflow ]] || {
            echo 'Set the GitHub Pages publishing source to GitHub Actions.'
            exit 1
          }
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build published posts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: npm run build
      - name: Read last deployed digest
        uses: actions/cache/restore@v5
        with:
          path: .last-site-digest
          key: notion-site-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: notion-site-v1-
      - name: Check whether the site changed
        id: digest
        working-directory: _site
        run: |
          set -o pipefail
          digest=$(find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)
          echo "value=$digest" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != schedule || ! -f ../.last-site-digest || $(cat ../.last-site-digest) != "$digest" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v4
        if: steps.digest.outputs.deploy == 'true'
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        if: steps.digest.outputs.deploy == 'true'
        with:
          name: vercel-static-site
          path: _site
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  deploy-vercel:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vercel-static-site
          path: .vercel/output/static
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare Vercel static output
        run: |
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/", "dest": "/index.html" },
              { "src": "/(.+?)/?", "dest": "/$1/index.html" }
            ]
          }
          JSON
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy static output to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

  record-deployment:
    needs: [build, deploy-pages, deploy-vercel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record successful deployment
        env:
          SITE_DIGEST: ${{ needs.build.outputs.digest }}
        run: printf '%s\n' "$SITE_DIGEST" > .last-site-digest
      - uses: actions/cache/save@v5
        with:
          path: .last-site-digest
          key: notion-site-v1-${{ github.run_id }}-${{ github.run_attempt }}
